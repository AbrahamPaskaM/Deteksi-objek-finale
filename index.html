<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#090a0d">
        <title>AI Scanner</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
        <style>
            :root {
                color-scheme: dark;
                font-family: "DM Sans", "Segoe UI", sans-serif;
                background: #090a0d;
                color: #f5f6f8;
                --muted: #a2a5ae;
                --line: rgb(255 255 255 / 12%);
                --accent: #50e3c2;
                --panel: #111318;
            }
            * { box-sizing: border-box; }
            body { min-width: 320px; min-height: 100vh; min-height: 100dvh; margin: 0; background: #090a0d; color: #f5f6f8; }
            button { color: inherit; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
            button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
            button:disabled { cursor: not-allowed; opacity: .42; }
            [hidden] { display: none !important; }
            .page-shell { position: relative; display: flex; flex-direction: column; width: min(100%, 480px); height: 100vh; height: 100dvh; min-height: 540px; margin: auto; overflow: hidden; background: #101116; box-shadow: 0 0 70px rgb(0 0 0 / 55%); }
            .topbar { z-index: 2; display: flex; flex: 0 0 62px; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px; background: #101116; }
            .brand { display: flex; align-items: center; gap: 9px; }
            .brand-mark { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 10px; background: linear-gradient(145deg, #54ecd0, #56aaf4); color: #101116; font-size: 18px; font-weight: 800; }
            h1, h2, p { margin: 0; }
            h1 { font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
            .intro, .eyebrow, .threshold-badge, .camera-help { display: none; }
            .mode-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 999px; color: #d5d6db; font-size: 10px; font-weight: 700; }
            .mode-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 9px var(--accent); }
            .dashboard-grid { position: relative; display: flex; flex: 1; min-height: 0; padding-bottom: 68px; }
            .camera-panel { position: relative; display: flex; flex: 1; min-height: 0; }
            .section-heading { display: none; }
            .controls { position: absolute; z-index: 3; top: 50%; right: 14px; display: flex; flex-direction: column; gap: 13px; transform: translateY(-50%); }
            .control-button { display: grid; justify-items: center; gap: 4px; width: 48px; padding: 0; border: 0; background: transparent; text-align: center; }
            .control-icon { display: grid; width: 40px; height: 40px; place-items: center; border: 1px solid rgb(255 255 255 / 22%); border-radius: 50%; background: rgb(17 19 24 / 82%); color: #fff; backdrop-filter: blur(8px); }
            .control-icon svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
            .control-label { color: #f3f3f6; font-size: 9px; font-weight: 600; text-shadow: 0 1px 4px #000; }
            .control-button[aria-pressed="true"] .control-icon, #stop-ai .control-icon { border-color: var(--accent); background: #164f48; color: var(--accent); }
            #start-ai .control-icon { background: #f6f7f8; color: #111318; }
            .camera-stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 45%, #32323b 0, #24242c 47%, #17181e 100%); }
            #video, #canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
            #video { object-fit: fill; }
            #canvas { pointer-events: none; }
            #overlay-msg { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 12px; padding: 24px 80px 150px 24px; color: #f6f6f8; background: rgb(18 18 23 / 30%); text-align: center; }
            #overlay-msg[hidden] { display: none; }
            #overlay-text { margin: 0; font-size: 13px; }
            .spinner { width: 28px; aspect-ratio: 1; border: 3px solid #ffffff66; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
            .detection-summary { position: absolute; z-index: 2; right: 76px; bottom: 20px; left: 16px; display: grid; gap: 7px; text-shadow: 0 1px 5px #000; pointer-events: none; }
            #detection-title { font-size: 15px; font-weight: 700; }
            #detection-detail { color: #e1e1e5; font-size: 11px; }
            #detection-chips { display: flex; flex-wrap: wrap; gap: 5px; }
            .detection-chip { padding: 4px 8px; border: 1px solid rgb(80 227 194 / 55%); border-radius: 999px; background: rgb(13 78 64 / 82%); color: #b6ffe9; font-size: 9px; font-weight: 700; }
            #app-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
            .data-section { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; min-width: 0; padding: 22px 20px; background: #101116; }
            .data-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
            .data-header h2 { font-size: 21px; }
            .count-badge { color: var(--accent); font-size: 12px; font-weight: 700; }
            .helper { margin: 0 0 18px; color: var(--muted); font-size: 12px; }
            #data-list { display: grid; align-content: start; max-height: 100%; overflow: auto; }
            .log-item { display: grid; gap: 6px; padding: 15px 0; border-top: 1px solid var(--line); }
            .log-item strong { font-size: 13px; line-height: 1.5; }
            .log-time { color: var(--muted); font-size: 11px; }
            .empty-state { padding: 24px 0; color: var(--muted); font-size: 13px; }
            .bottom-nav { position: absolute; z-index: 5; right: 0; bottom: 0; left: 0; display: grid; height: 68px; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); background: rgb(13 14 18 / 96%); padding-bottom: env(safe-area-inset-bottom); }
            .nav-button { position: relative; display: grid; align-content: center; justify-items: center; gap: 3px; border: 0; background: transparent; color: #8f929b; font-size: 9px; font-weight: 600; }
            .nav-button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
            .nav-button[aria-current="page"] { color: white; }
            .nav-button[aria-current="page"] svg { color: var(--accent); }
            .nav-count { position: absolute; top: 9px; left: calc(50% + 8px); min-width: 14px; padding: 2px 4px; border-radius: 99px; background: #ed3c71; color: #fff; font-size: 8px; }
            @keyframes spin { to { transform: rotate(360deg); } }
            @media (min-width: 700px) {
                body { display: grid; place-items: center; padding: 24px; }
                .page-shell { height: min(900px, calc(100dvh - 48px)); min-height: 540px; border: 1px solid #282a32; border-radius: 30px; }
            }
            @media (max-height: 620px) {
                .topbar { flex-basis: 54px; }
                .controls { gap: 7px; }
                .control-icon { width: 35px; height: 35px; }
                .bottom-nav { height: 58px; }
                .dashboard-grid { padding-bottom: 58px; }
            }
        </style>
    </head>
    <body>
        <div class="page-shell">
            <header class="topbar">
                <div class="brand">
                    <span class="brand-mark" aria-hidden="true">A</span>
                    <h1>AI Scanner</h1>
                </div>
                <span id="database-mode" class="mode-badge"><span class="mode-dot"></span> DEMO</span>
            </header>

            <main class="dashboard-grid">
                <section class="camera-panel" aria-labelledby="camera-title">
                    <div class="section-heading">
                        <h2 id="camera-title">Kamera & deteksi</h2>
                        <span class="threshold-badge">Confidence minimal 40%</span>
                    </div>
                    <div class="controls">
                        <button id="start-camera" class="control-button" type="button" aria-label="Aktifkan kamera">
                            <span class="control-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h3l2-2h6l2 2h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
                            <span class="control-label">Kamera</span>
                        </button>
                        <button id="stop-camera" class="control-button" type="button" aria-label="Matikan kamera" hidden>
                            <span class="control-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h3l2-2h6l2 2h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><path d="m9 9 6 8m0-8-6 8"/></svg></span>
                            <span class="control-label">Matikan</span>
                        </button>
                        <button id="switch-camera" class="control-button" type="button" aria-label="Ganti kamera" disabled>
                            <span class="control-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 7l2 5M4 12l2 5a7 7 0 0 0 12.4-2"/></svg></span>
                            <span class="control-label">Balik</span>
                        </button>
                        <button id="start-ai" class="control-button" type="button" aria-label="Mulai deteksi AI">
                            <span class="control-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/><circle cx="12" cy="12" r="4"/></svg></span>
                            <span class="control-label">AI Scan</span>
                        </button>
                        <button id="stop-ai" class="control-button" type="button" aria-label="Hentikan deteksi AI" disabled hidden>
                            <span class="control-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></span>
                            <span class="control-label">Stop AI</span>
                        </button>
                        <button id="toggle-torch" class="control-button" type="button" aria-label="Aktifkan flash" aria-pressed="false" disabled>
                            <span class="control-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 2 5 13h6l-1 9 9-12h-6l1-8Z"/></svg></span>
                            <span class="control-label">Flash</span>
                        </button>
                    </div>
                    <div id="camera-container" class="camera-stage">
                        <video id="video" autoplay playsinline muted></video>
                        <canvas id="canvas"></canvas>
                        <div id="overlay-msg" role="status" hidden>
                            <div class="spinner" aria-hidden="true"></div>
                            <p id="overlay-text"></p>
                        </div>
                    </div>
                    <div class="detection-summary" aria-live="polite">
                        <h2 id="detection-title">Siap mendeteksi</h2>
                        <p id="detection-detail">Aktifkan AI Scan untuk mulai</p>
                        <div id="detection-chips"></div>
                    </div>
                    <p id="app-status" role="status" aria-live="polite">Menyiapkan aplikasi...</p>
                </section>

                <section class="data-section" aria-labelledby="data-title" hidden>
                    <header class="data-header">
                        <div>
                            <h2 id="data-title">Riwayat deteksi</h2>
                        </div>
                        <span class="count-badge"><span id="log-count">0</span> item</span>
                    </header>
                    <p class="helper">Hasil target terbaru, maksimal 20 catatan.</p>
                    <div id="data-list" aria-live="polite">
                        <p class="empty-state">Belum ada objek terdeteksi.</p>
                    </div>
                </section>
            </main>
            <nav class="bottom-nav" aria-label="Navigasi utama">
                <button class="nav-button" type="button" data-view="scanner" aria-current="page">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>
                    <span>Scanner</span>
                </button>
                <button class="nav-button" type="button" data-view="history">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v15H4zM8 9h8m-8 4h8m-8 4h5"/></svg>
                    <span>Log Data</span>
                    <span class="nav-count" id="nav-log-count" hidden>0</span>
                </button>
            </nav>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

        <script type="module">
            import { app, db, isMockMode, listenForDetections } from "./db.js";
            import { startCamera, stopCamera, switchCamera, toggleTorch } from "./camera.js";
            import { loadModel, startAI, stopAI } from "./ai.js";

            const dataList = document.getElementById("data-list");
            const logCount = document.getElementById("log-count");
            const appStatus = document.getElementById("app-status");
            const databaseMode = document.getElementById("database-mode");
            const cameraPanel = document.querySelector(".camera-panel");
            const dataSection = document.querySelector(".data-section");
            const navLogCount = document.getElementById("nav-log-count");

            function renderDetections(records) {
                dataList.replaceChildren();
                logCount.textContent = String(records.length);
                navLogCount.textContent = String(records.length);
                navLogCount.hidden = records.length === 0;

                if (records.length === 0) {
                    const emptyMessage = document.createElement("p");
                    emptyMessage.className = "empty-state";
                    emptyMessage.textContent = "Belum ada objek terdeteksi.";
                    dataList.appendChild(emptyMessage);
                    return;
                }

                records.forEach((record) => {
                    const item = document.createElement("article");
                    item.className = "log-item";

                    const summary = document.createElement("strong");
                    summary.textContent = record.items || `${record.count || 0} objek terdeteksi`;

                    const details = document.createElement("span");
                    details.className = "log-time";
                    const timestamp = record.timestamp?.toDate
                        ? record.timestamp.toDate()
                        : new Date(record.timestamp);
                    const formattedTime = Number.isNaN(timestamp.getTime())
                        ? "Waktu tidak tersedia"
                        : timestamp.toLocaleString("id-ID");
                    details.textContent = `${record.deviceId || "Perangkat"} | ${formattedTime}`;

                    item.append(summary, details);
                    dataList.appendChild(item);
                });
            }

            async function initApp() {
                databaseMode.innerHTML = `<span class="mode-dot"></span> ${isMockMode ? "Mock · LocalStorage" : "Firebase · Cloud"}`;
                console.log(isMockMode ? "Mock database initialized:" : "Firebase initialized:", isMockMode ? db : app);
                listenForDetections(renderDetections, (error) => {
                    console.error("Gagal memuat riwayat deteksi:", error);
                    appStatus.textContent = "Gagal memuat riwayat database.";
                });

                try {
                    await loadModel();
                    appStatus.textContent = "Model AI siap. Aktifkan kamera atau mulai deteksi.";
                } catch (error) {
                    console.error("Inisialisasi model AI gagal:", error);
                    appStatus.textContent = "Model AI gagal dimuat. Periksa koneksi internet.";
                }
            }

            async function handleCameraAction(action, successMessage) {
                try {
                    await action();
                    if (successMessage) appStatus.textContent = successMessage;
                } catch (error) {
                    console.error("Aksi kamera gagal:", error);
                    appStatus.textContent = error.message || "Aksi kamera gagal.";
                }
            }

            document.getElementById("start-camera").addEventListener("click", () => {
                void handleCameraAction(startCamera, "Kamera aktif.");
            });
            document.getElementById("stop-camera").addEventListener("click", () => {
                stopAI();
                stopCamera();
                appStatus.textContent = "Kamera dimatikan.";
            });
            document.getElementById("switch-camera").addEventListener("click", () => {
                void handleCameraAction(switchCamera, "Kamera berhasil diganti.");
            });
            document.getElementById("toggle-torch").addEventListener("click", () => {
                void handleCameraAction(toggleTorch, "Pengaturan flash diperbarui.");
            });
            document.getElementById("start-ai").addEventListener("click", startAI);
            document.getElementById("stop-ai").addEventListener("click", stopAI);
            document.querySelectorAll(".nav-button").forEach((button) => {
                button.addEventListener("click", () => {
                    const isHistory = button.dataset.view === "history";
                    cameraPanel.hidden = isHistory;
                    dataSection.hidden = !isHistory;
                    document.querySelectorAll(".nav-button").forEach((navButton) => {
                        if (navButton === button) navButton.setAttribute("aria-current", "page");
                        else navButton.removeAttribute("aria-current");
                    });
                });
            });

            void initApp();
        </script>
    </body>
</html>
